<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ระบบจองห้องประชุม by witchuda</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap');

  :root{
    --neon-pink:#FF9FC3;
    --neon-pink-dark:#F06FA0;
    --neon-yellow:#E8C988;
    --neon-cyan:#A8E0F5;
    --neon-lime:#D9D9F7;

    --paper:#FBF8FE;
    --surface:#FFFFFF;
    --ink:#3B3650;
    --ink-muted:#7C7690;
    --ink-faint:#A9A3BC;
    --border:#F0EBFA;

    --brand:#FF8FB8;
    --brand-dark:#F06FA0;
    --brand-tint:#FFEAF3;

    --free:#5FA777;
    --free-tint:#E6F7EA;
    --busy:#E0607E;
    --busy-tint:#FDE4EC;
    --amber:#B8933E;
    --amber-tint:#FBF1DC;
    --cyan-tint:#E5F6FD;

    --radius:18px;
    --shadow: 0 2px 4px rgba(59,54,80,0.05), 0 14px 32px rgba(59,54,80,0.09);
  }
  *{box-sizing:border-box;}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background: linear-gradient(180deg, var(--neon-cyan) 0%, var(--neon-cyan) 40%, var(--neon-pink) 40%, var(--neon-pink) 100%);
    background-attachment:fixed;
    color:var(--ink);
    font-family:'Kanit',sans-serif;
    -webkit-font-smoothing:antialiased;
    padding:22px;
  }
  .hero-title{
    text-align:center; font-family:'Kanit',sans-serif; font-weight:800; font-size:40px;
    color:#fff; margin:6px 0 24px; line-height:1.2;
    text-shadow:
      2px 2px 0 var(--neon-pink-dark), -2px -2px 0 var(--neon-pink-dark),
      2px -2px 0 var(--neon-pink-dark), -2px 2px 0 var(--neon-pink-dark),
      4px 4px 0 rgba(240,111,160,.5);
  }
  .hero-title span{
    display:block; font-size:0.42em; font-weight:600; margin-top:8px;
    text-shadow:1.5px 1.5px 0 var(--neon-pink-dark), -1.5px -1.5px 0 var(--neon-pink-dark),
      1.5px -1.5px 0 var(--neon-pink-dark), -1.5px 1.5px 0 var(--neon-pink-dark);
  }

  .browser-frame{
    max-width:1220px; margin:0 auto; background:var(--surface);
    border-radius:28px; box-shadow:0 30px 70px rgba(27,23,38,.35);
    overflow:hidden;
  }
  .browser-topbar{
    display:flex; align-items:center; gap:14px; padding:16px 22px;
    border-bottom:1px solid var(--border);
  }
  .browser-dots{display:flex; gap:7px;}
  .browser-dots span{width:12px; height:12px; border-radius:50%; display:block;}
  .browser-dots .d1{background:#FF5F57;}
  .browser-dots .d2{background:#FFBD2E;}
  .browser-dots .d3{background:#28C840;}
  .browser-search{
    flex:1; background:var(--paper); border-radius:100px; padding:8px 16px;
    font-size:13px; color:var(--ink-muted); font-family:'JetBrains Mono',monospace;
    max-width:360px;
  }

  #app{max-width:1180px; margin:0 auto; padding:24px 24px 72px;}

  .topbar{
    display:flex; align-items:flex-end; justify-content:space-between;
    margin-bottom:24px; flex-wrap:wrap; gap:16px;
  }
  .brand-block .eyebrow{
    display:inline-block; font-size:13px; font-weight:700; color:var(--ink);
    background:var(--neon-yellow); padding:5px 14px; border-radius:100px;
    transform:rotate(-2deg); margin-bottom:10px; box-shadow:0 3px 0 rgba(27,23,38,.12);
  }
  .brand-block h1{
    font-family:'Kanit',sans-serif; font-size:32px; margin:0; font-weight:800;
    letter-spacing:-0.01em; color:var(--ink);
    text-shadow: 3px 3px 0 var(--neon-cyan);
  }
  .byline{
    display:block; font-size:12.5px; color:var(--ink-muted); margin-top:6px; font-style:italic;
  }
  .clock-block{
    text-align:right; font-family:'JetBrains Mono',monospace;
  }
  .clock-block .time{font-size:26px; font-weight:700; color:var(--brand); line-height:1;}
  .clock-block .date{font-size:13px; color:var(--ink-muted); margin-top:4px;}

  /* ROOM CARDS */
  .room-grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:18px;
  }
  .room-card{
    background:var(--surface); border:1px solid var(--border); border-radius:20px;
    padding:18px 18px 16px; box-shadow:var(--shadow); cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease;
    display:flex; flex-direction:column; gap:12px;
    border-top:6px solid var(--accent, var(--neon-pink));
  }
  .room-card:hover{transform:translateY(-3px) rotate(-0.3deg); box-shadow:0 6px 10px rgba(27,23,38,.08), 0 20px 36px rgba(27,23,38,.14);}
  .room-card:focus-visible, .icon-btn:focus-visible, .btn:focus-visible, select:focus-visible, input:focus-visible{
    outline:3px solid var(--neon-cyan); outline-offset:2px;
  }
  .room-card.accent-pink{--accent:var(--neon-pink);}
  .room-card.accent-yellow{--accent:var(--neon-yellow);}
  .room-card.accent-cyan{--accent:var(--neon-cyan);}
  .room-card.accent-lime{--accent:var(--neon-lime);}

  .room-head{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .room-name{font-family:'Kanit',sans-serif; font-size:19px; font-weight:700;}
  .room-meta{font-size:12.5px; color:var(--ink-muted); margin-top:2px;}
  .status-pill{
    font-family:'Kanit',sans-serif; font-size:12px; font-weight:700;
    padding:5px 12px; border-radius:100px; white-space:nowrap;
  }
  .status-pill.free{background:var(--free-tint); color:var(--free);}
  .status-pill.busy{background:var(--busy-tint); color:var(--busy);}

  .room-current{font-size:13px; color:var(--ink); min-height:18px;}
  .room-current b{font-weight:700;}
  .room-next{font-size:12px; color:var(--ink-muted); font-family:'JetBrains Mono',monospace;}

  .mini-timeline{position:relative; height:26px; border-radius:8px; background:var(--free-tint); overflow:hidden; border:1px solid var(--border);}
  .mini-block{position:absolute; top:0; bottom:0; background:var(--neon-pink); opacity:.9;}
  .mini-now{position:absolute; top:-2px; bottom:-2px; width:3px; background:var(--ink); z-index:2; border-radius:2px;}
  .mini-ticks{display:flex; justify-content:space-between; font-family:'JetBrains Mono',monospace; font-size:9.5px; color:var(--ink-faint); margin-top:3px;}

  /* ROOM DETAIL VIEW */
  .back-btn{
    display:inline-flex; align-items:center; gap:6px; background:none; border:none;
    color:var(--brand); font-family:'Kanit',sans-serif; font-weight:700; font-size:14px;
    cursor:pointer; padding:8px 0; margin-bottom:12px;
  }
  .back-btn:hover{text-decoration:underline;}

  .detail-header{
    display:flex; justify-content:space-between; align-items:flex-start; gap:16px;
    flex-wrap:wrap; margin-bottom:20px;
  }
  .detail-title{
    font-family:'Kanit',sans-serif; font-size:28px; font-weight:800;
    text-shadow:3px 3px 0 var(--neon-yellow);
  }
  .detail-meta{color:var(--ink-muted); font-size:13.5px; margin-top:6px;}

  .btn{
    font-family:'Kanit',sans-serif; font-weight:700; font-size:14px; border-radius:100px;
    padding:11px 20px; cursor:pointer; border:2px solid transparent; transition:transform .12s, background .15s;
  }
  .btn.primary{background:var(--brand); color:#fff; box-shadow:0 4px 0 var(--brand-dark);}
  .btn.primary:hover{transform:translateY(-1px);}
  .btn.primary:active{transform:translateY(2px); box-shadow:0 1px 0 var(--brand-dark);}
  .btn.ghost{background:var(--surface); border-color:var(--neon-cyan); color:var(--ink);}
  .btn.ghost:hover{background:var(--cyan-tint);}
  .btn.small{padding:6px 14px; font-size:12px;}
  .btn.danger-outline{background:var(--surface); border-color:var(--busy); color:var(--busy);}

  .date-nav{
    display:flex; align-items:center; gap:10px; background:var(--paper); border:1px solid var(--border);
    border-radius:100px; padding:10px 16px; margin-bottom:16px; flex-wrap:wrap;
  }
  .icon-btn{
    width:34px; height:34px; border-radius:50%; border:2px solid var(--neon-cyan); background:var(--surface);
    display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:17px; color:var(--ink); font-weight:700;
  }
  .icon-btn:hover{background:var(--cyan-tint);}
  .date-nav input[type=date]{
    font-family:'JetBrains Mono',monospace; border:1px solid var(--border); border-radius:10px;
    padding:7px 10px; font-size:13.5px; background:var(--surface); color:var(--ink);
  }
  .date-nav .today-badge{
    font-family:'Kanit',sans-serif; font-size:12px; color:var(--ink); font-weight:700;
    background:var(--neon-lime); padding:5px 12px; border-radius:100px;
  }
  .date-nav .spacer{flex:1;}

  .day-banner{
    display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
    background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:14px 20px;
    margin-bottom:16px; box-shadow:var(--shadow);
  }
  .day-banner .label{font-size:13px; color:var(--ink-muted);}
  .day-banner .status{font-family:'Kanit',sans-serif; font-weight:800; font-size:18px;}
  .day-banner .status.free{color:var(--free);}
  .day-banner .status.busy{color:var(--busy);}

  /* timeline grid */
  .timeline-wrap{
    background:var(--surface); border:1px solid var(--border); border-radius:20px;
    box-shadow:var(--shadow); padding:18px; overflow-x:auto;
  }
  .timeline{position:relative; display:flex; min-width:340px;}
  .timeline-labels{width:56px; flex-shrink:0;}
  .timeline-track{position:relative; flex:1; border-left:1px solid var(--border);}
  .tl-row{height:40px; border-bottom:1px dashed var(--border); position:relative;}
  .tl-row:last-child{border-bottom:none;}
  .tl-label{
    height:40px; display:flex; align-items:flex-start; justify-content:flex-end;
    padding-right:10px; font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--ink-faint);
    transform:translateY(-6px);
  }
  .tl-label.hour{color:var(--ink-muted); font-weight:700;}
  .tl-slot-btn{
    position:absolute; inset:1px 4px; border-radius:8px; cursor:pointer; border:1px dashed transparent;
  }
  .tl-slot-btn:hover{background:var(--free-tint); border-color:var(--free);}
  .booking-block{
    position:absolute; left:4px; right:4px; background:var(--busy-tint); border-left:4px solid var(--neon-pink);
    border-radius:10px; padding:6px 10px; overflow:hidden;
  }
  .booking-block .b-time{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--busy); font-weight:700;}
  .booking-block .b-title{font-size:12.5px; font-weight:700; color:var(--ink); margin-top:1px;}
  .booking-block .b-who{font-size:11px; color:var(--ink-muted);}
  .booking-block .b-del{
    position:absolute; top:4px; right:4px; width:20px; height:20px; border-radius:50%;
    background:#fff; border:1px solid var(--busy); color:var(--busy);
    cursor:pointer; font-size:12px; line-height:1; display:flex; align-items:center; justify-content:center;
    opacity:.75; transition:opacity .15s, transform .15s;
  }
  .booking-block .b-del:hover{opacity:1; transform:scale(1.1);}
  .booking-block:hover .b-del{opacity:1;}
  .now-line{position:absolute; left:0; right:0; height:3px; background:var(--ink); z-index:3; border-radius:2px;}
  .now-line::before{
    content:'ตอนนี้'; position:absolute; left:-4px; top:-9px; font-family:'Kanit',sans-serif; font-weight:700;
    font-size:10px; background:var(--ink); color:#fff; padding:1px 6px; border-radius:4px; transform:translateX(-100%);
  }

  /* MODAL */
  .overlay{
    position:fixed; inset:0; background:rgba(27,23,38,.5); display:flex; align-items:center;
    justify-content:center; z-index:50; padding:20px;
  }
  .modal{
    background:var(--surface); border-radius:24px; padding:28px; width:100%; max-width:420px;
    box-shadow:0 20px 60px rgba(0,0,0,.3);
    border-top:8px solid var(--neon-pink);
  }
  .modal h2{font-family:'Kanit',sans-serif; font-size:21px; margin:0 0 4px; font-weight:800;}
  .modal .sub{font-size:13px; color:var(--ink-muted); margin-bottom:18px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12.5px; font-weight:700; color:var(--ink-muted); margin-bottom:5px;}
  .field input, .field select{
    width:100%; padding:10px 12px; border:2px solid var(--border); border-radius:12px;
    font-family:'Kanit',sans-serif; font-size:14px; background:var(--paper); color:var(--ink);
  }
  .field input:focus, .field select:focus{border-color:var(--neon-cyan); outline:none;}
  .field-row{display:flex; gap:10px;}
  .field-row .field{flex:1;}
  .field .err{color:var(--busy); font-size:12px; margin-top:4px; display:none;}
  .field.has-err .err{display:block;}
  .field.has-err input, .field.has-err select{border-color:var(--busy);}
  .modal-actions{display:flex; gap:10px; margin-top:20px;}
  .modal-actions .btn{flex:1;}

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--ink); color:#fff; padding:12px 22px; border-radius:100px; font-size:13.5px;
    font-weight:700; box-shadow:0 10px 30px rgba(0,0,0,.3); z-index:60; opacity:0;
    transition:opacity .2s, transform .2s; pointer-events:none; font-family:'Kanit',sans-serif;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  .empty-note{font-size:12.5px; color:var(--ink-faint); font-family:'JetBrains Mono',monospace; padding:8px 0;}

  .sync-banner{
    background:var(--amber-tint); color:var(--amber); border:2px solid var(--neon-yellow);
    border-radius:14px; padding:10px 16px; font-size:13px; font-weight:700; margin-bottom:16px;
  }
  .sync-ok{
    display:inline-flex; align-items:center; gap:6px; font-family:'JetBrains Mono',monospace;
    font-size:11px; color:var(--free); margin:0 0 18px;
  }
  .sync-ok::before{content:'●'; font-size:9px;}

  .access-badge{
    font-family:'Kanit',sans-serif; font-size:12px; font-weight:700;
    padding:7px 14px; border-radius:100px; border:2px solid; cursor:pointer; white-space:nowrap;
  }
  .access-badge.locked{background:var(--busy-tint); color:var(--busy); border-color:var(--busy);}
  .access-badge.unlocked{background:var(--free-tint); color:var(--free); border-color:var(--free);}

  .week-grid{
    display:grid; grid-template-columns:repeat(5,minmax(130px,1fr)); gap:12px;
    overflow-x:auto; padding-bottom:6px;
  }
  .week-day-card{
    background:var(--surface); border:2px solid var(--border); border-radius:16px;
    padding:14px 12px; cursor:pointer; transition:transform .12s ease, box-shadow .12s ease;
    display:flex; flex-direction:column; gap:10px; min-width:130px;
  }
  .week-day-card:hover{transform:translateY(-2px); box-shadow:var(--shadow);}
  .week-day-card.is-today{border-color:var(--neon-cyan);}
  .week-day-head{display:flex; justify-content:space-between; align-items:baseline;}
  .week-day-dow{font-size:12px; color:var(--ink-muted); font-weight:700;}
  .week-day-num{font-family:'Kanit',sans-serif; font-weight:800; font-size:21px;}
  .week-day-list{font-size:11px; color:var(--ink-muted); display:flex; flex-direction:column; gap:4px; font-family:'JetBrains Mono',monospace;}
  .week-day-list .item{white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .week-day-list .more{color:var(--ink-faint); font-style:italic;}
  .week-nav-label{
    font-family:'Kanit',sans-serif; font-weight:700; font-size:14px; color:var(--ink); white-space:nowrap;
  }
  .week-all-rooms{display:flex; flex-direction:column; gap:28px;}
  .week-room-block{background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:18px; box-shadow:var(--shadow);}
  .week-room-heading{
    display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; cursor:pointer;
    margin-bottom:14px; padding-bottom:12px; border-bottom:1px solid var(--border);
  }
  .week-room-heading:hover .week-room-name{color:var(--brand);}
  .week-room-name{font-family:'Kanit',sans-serif; font-weight:800; font-size:18px; color:var(--ink); transition:color .12s;}
  .week-room-meta{font-size:12.5px; color:var(--ink-muted);}

  @media (max-width:560px){
    body{padding:10px;}
    .clock-block{text-align:left;}
    .topbar{flex-direction:column; align-items:flex-start;}
    .browser-search{display:none;}
    .week-grid{grid-template-columns:repeat(5,130px);}
  }
</style>
</head>
<body>
<div class="hero-title">ระบบจองห้องประชุม<span>by witchuda</span></div>
<div class="browser-frame">
  <div class="browser-topbar">
    <div class="browser-dots"><span class="d1"></span><span class="d2"></span><span class="d3"></span></div>
    <div class="browser-search">🔍 ระบบจองห้องประชุม</div>
  </div>
  <div id="app"></div>
</div>
<div id="toast" class="toast"></div>

<script>
/* ---------------- DATA ---------------- */
const ROOMS = [
  {id:'room1', name:'ห้องประชุมสาขาวิชา', amenities:'อุปกรณ์ครบ', capacity:30},
  {id:'room2', name:'ห้องสัมมนา 1', amenities:'อุปกรณ์ครบ', capacity:12},
  {id:'room3', name:'ห้องสัมมนา 2', amenities:'อุปกรณ์ครบ', capacity:12},
  {id:'room4', name:'ห้องสัมมนา 3', amenities:'อุปกรณ์ครบ', capacity:12},
  {id:'room5', name:'ห้องสัมมนา 4', amenities:'อุปกรณ์ครบ', capacity:12},
  {id:'room6', name:'ห้องบรรยาย/ห้องเรียน', amenities:'อุปกรณ์ครบ', capacity:'50+'},
];
const ACCENTS = ['accent-pink','accent-yellow','accent-cyan','accent-lime'];

const DAY_START = 8*60;   // 08:00 in minutes
const DAY_END   = 17*60;  // 17:00 in minutes
const SLOT      = 30;     // minutes
const SLOT_PX   = 40;
const TOTAL_SLOTS = (DAY_END-DAY_START)/SLOT;

function todayISO(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function pad(n){return String(n).padStart(2,'0');}
function minToLabel(min){return pad(Math.floor(min/60))+':'+pad(min%60);}
function labelToMin(lbl){const [h,m]=lbl.split(':').map(Number); return h*60+m;}
function uid(){return Math.random().toString(36).slice(2,9);}

/* ---------------- GOOGLE SHEETS CONFIG ----------------
   วิธีเชื่อมต่อ (ดูรายละเอียดขั้นตอนที่ Code.gs ที่แนบมาให้):
   1. สร้าง Google Sheet ว่าง 1 ไฟล์
   2. เปิด Extensions > Apps Script แล้ววางโค้ดจากไฟล์ Code.gs
   3. Deploy > New deployment > Web app
      - Execute as: Me
      - Who has access: Anyone
   4. คัดลอก URL ที่ได้มาวางแทนค่า API_URL ด้านล่างนี้
------------------------------------------------------- */
const API_URL = 'https://script.google.com/macros/s/AKfycbxFY85AFzjn7wN3hrogxk549Sd3TR-gd-358Y6utNYX0p_8sbAtEag9SFL8NU1Gi1Gx/exec';

let bookings = [];
let dataReady = false;
let syncError = false;
let lastSync = null;
let currentUser = null; // {username, password, name, isAdmin}
try{
  const savedUser = localStorage.getItem('bookingUser');
  if(savedUser) currentUser = JSON.parse(savedUser);
}catch(e){ console.warn('ไม่สามารถอ่านสถานะล็อกอินเดิมได้', e); }
function saveSession(){ try{ localStorage.setItem('bookingUser', JSON.stringify(currentUser)); }catch(e){} }
function clearSession(){ try{ localStorage.removeItem('bookingUser'); }catch(e){} }

function parseTimeVal(v){
  if(typeof v==='number') return v;
  if(typeof v==='string' && v.includes(':')) return labelToMin(v.trim());
  const n = Number(v);
  return isNaN(n) ? 0 : n;
}

let loginResolver = null;
function askLogin(){
  return new Promise(resolve=>{
    loginResolver = resolve;
    document.getElementById('modal-root').innerHTML = `
    <div class="overlay" onclick="if(event.target===this)resolveLoginModal(null)">
      <div class="modal">
        <h2>🔐 ระบบจองห้องประชุม by witchuda</h2>
        <div class="sub">เข้าสู่ระบบเพื่อจอง/ยกเลิกห้อง</div>
        <div class="field">
          <label>ชื่อผู้ใช้</label>
          <input id="f-username" type="text" placeholder="กรอกชื่อผู้ใช้" autocomplete="username">
        </div>
        <div class="field">

async function requireEdit(){
  if(currentUser) return true;
  const cred = await askLogin();
  if(!cred) return false;
  showToast('กำลังตรวจสอบ...');
  try{
    const res = await fetch(API_URL, {method:'POST', body: JSON.stringify({action:'login', username:cred.username, password:cred.password})});
    const result = await res.json();
    if(result && result.ok){
      currentUser = {username:cred.username, password:cred.password, name:result.name, isAdmin:!!result.isAdmin};
      saveSession();
      showToast(`เข้าสู่ระบบสำเร็จ: ${result.name}${result.isAdmin?' (ผู้ดูแลระบบ)':''}`);

let state = { view:'home', roomId:null, selectedDate:todayISO(), homeDate:todayISO(), weekDate:todayISO() };

/* ---------------- HELPERS ---------------- */
function nowMinutes(){const d=new Date(); return d.getHours()*60+d.getMinutes();}
function isToday(dateStr){return dateStr===todayISO();}

function roomBookings(roomId, date){
  return bookings.filter(b=>b.roomId===roomId && b.date===date).sort((a,b)=>a.start-b.start);
}
function currentBooking(roomId){
  const t = todayISO();
  const nm = nowMinutes();
  return roomBookings(roomId,t).find(b=> nm>=b.start && nm<b.end);
}
function nextBooking(roomId){
  const t = todayISO();
  const nm = nowMinutes();
  return roomBookings(roomId,t).find(b=> b.start>nm);
}
function dayFirstBooking(roomId,date){
  return roomBookings(roomId,date)[0] || null;
}
function isFullDay(roomId,date){
  const list = roomBookings(roomId,date);
  let cursor = DAY_START;
  for(const b of list){
    if(b.start>cursor) return false;
    cursor = Math.max(cursor,b.end);
  }
  return cursor>=DAY_END;
}
function hasOverlap(roomId,date,start,end,excludeId){
  return bookings.some(b=> b.roomId===roomId && b.date===date && b.id!==excludeId && start<b.end && end>b.start);
}
function fmtDateThai(dateStr){
  const months = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
  const [y,m,d] = dateStr.split('-').map(Number);
  return `${d} ${months[m-1]} ${y+543}`;
}
function shiftDate(dateStr,delta){
  const d = new Date(dateStr+'T00:00:00');
  d.setDate(d.getDate()+delta);
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
}
function mondayOf(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  const day = d.getDay(); // 0=อาทิตย์ ... 6=เสาร์
  const offset = (day===0) ? -6 : (1-day);
  return shiftDate(dateStr, offset);
}
function weekDates(mondayDateStr){
  return Array.from({length:5}, (_,i)=> shiftDate(mondayDateStr, i)); // จันทร์-ศุกร์เท่านั้น
}
function fmtWeekRangeThai(mondayDateStr){
  const days = weekDates(mondayDateStr);
  const start = days[0], end = days[days.length-1];
  const [ys,ms,ds] = start.split('-').map(Number);
  const [ye,me,de] = end.split('-').map(Number);
  const months = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
  if(ys===ye && ms===me) return `${ds} – ${de} ${months[ms-1]} ${ys+543}`;
  return `${fmtDateThai(start)} – ${fmtDateThai(end)}`;
}

function renderClock(){
  const d = new Date();
  const time = pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());
  const days = ['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
  return `<div class="clock-block"><div class="time">${time}</div><div class="date">วัน${days[d.getDay()]}ที่ ${fmtDateThai(todayISO())}</div></div>`;
}

function miniTimeline(roomId, date){
  const list = roomBookings(roomId, date);
  const totalMin = DAY_END-DAY_START;
  let blocks = list.map(b=>{
    const left = Math.max(0,(b.start-DAY_START)/totalMin*100);
    const width = (Math.min(b.end,DAY_END)-Math.max(b.start,DAY_START))/totalMin*100;
    return `<div class="mini-block" style="left:${left}%;width:${width}%"></div>`;
  }).join('');
  let nowMark = '';
  if(isToday(date)){
    const nm = nowMinutes();
    if(nm>=DAY_START && nm<=DAY_END){
      const left = (nm-DAY_START)/totalMin*100;
      nowMark = `<div class="mini-now" style="left:${left}%"></div>`;
    }
  }
  return `<div class="mini-timeline">${blocks}${nowMark}</div>
  <div class="mini-ticks"><span>${minToLabel(DAY_START)}</span><span>${minToLabel((DAY_START+DAY_END)/2)}</span><span>${minToLabel(DAY_END)}</span></div>`;
}

function renderRoomCard(room, date){
  const today = isToday(date);
  const cur = today ? currentBooking(room.id) : null;

  const full = isFullDay(room.id, date);
  const busy = today ? !!cur : full;
  const accentIdx = ROOMS.findIndex(r=>r.id===room.id);
  const accentClass = ACCENTS[accentIdx % ACCENTS.length];

  let currentLine;
  if(today){
    currentLine = cur ? `กำลังใช้: <b>${cur.title}</b> (${minToLabel(cur.start)}–${minToLabel(cur.end)})` : (nxt? `ว่างจนถึง ${minToLabel(nxt.start)}` : 'ว่างตลอดวันนี้');
  } else {
    currentLine = list.length ? `มีการจอง ${list.length} รายการในวันนี้` : 'ไม่มีการจองในวันนี้';
  }

  let nextLine;
  if(today){
    nextLine = nxt ? `▸ ถัดไป ${minToLabel(nxt.start)}–${minToLabel(nxt.end)} · ${nxt.title}` : '▸ ไม่มีการจองถัดไปวันนี้';

  }

  return `

      <div class="modal-actions">
        <button class="btn ghost" onclick="closeModal()">ยกเลิก</button>
        <button class="btn primary" onclick="submitBooking()">ยืนยันการจอง</button>
      </div>
    </div>
  </div>`;
  document.getElementById('f-start').value = startVal;
  document.getElementById('f-end').value = endVal;
}
function onStartChange(){
  const startVal = Number(document.getElementById('f-start').value);
  const endSel = document.getElementById('f-end');
  endSel.innerHTML = timeOptions('end', startVal);
  endSel.value = Math.min(startVal+60, DAY_END);
}
function closeModal(){
  modalState = null;
  document.getElementById('modal-root').innerHTML = '';
}
async function submitBooking(){
  if(!currentUser){ showToast('กรุณาเข้าสู่ระบบก่อนจอง'); closeModal(); return; }
  const title = document.getElementById('f-title').value.trim();
  const start = Number(document.getElementById('f-start').value);
  const end = Number(document.getElementById('f-end').value);
  let ok = true;
  toggleErr('f-title', !title); if(!title) ok=false;
  if(end<=start){ ok=false; }
  if(!ok){ return; }
  if(hasOverlap(modalState.roomId, modalState.date, start, end, null)){
    document.getElementById('f-conflict-wrap').style.display='block';
    return;
  }
  if(!API_URL || API_URL.includes('PASTE_YOUR')){
    showToast('ยังไม่ได้ตั้งค่า Google Sheet — ดูคำแนะนำการเชื่อมต่อ');
    return;
  }
  const newBooking = {id:uid(), roomId:modalState.roomId, date:modalState.date, start:minToLabel(start), end:minToLabel(end), title};
  closeModal();
  showToast('กำลังบันทึกลง Google Sheet...');
  try{
    const res = await fetch(API_URL, {method:'POST', body: JSON.stringify({action:'add', booking:newBooking, username:currentUser.username, password:currentUser.password})});
    const result = await res.json();
    if(!result || !result.ok) throw new Error(result && result.error ? result.error : 'การเชื่อมต่อ Google Sheet ล้มเหลว (ตรวจสอบการ Deploy)');
    await loadBookings();
    showToast('จองห้องสำเร็จ');
  }catch(err){
    console.error('บันทึกการจองไม่สำเร็จ:', err);
    showToast('บันทึกไม่สำเร็จ: ' + err.message);
  }
}
function toggleErr(id, isErr){
  const field = document.getElementById(id).closest('.field');
  field.classList.toggle('has-err', isErr);
}
async function deleteBooking(id){
  if(!(await requireEdit())) return;
  if(!(await askConfirm('ยกเลิกการจองนี้ใช่หรือไม่?'))) return;
  if(!API_URL || API_URL.includes('PASTE_YOUR')){
    showToast('ยังไม่ได้ตั้งค่า Google Sheet — ดูคำแนะนำการเชื่อมต่อ');
    return;
  }
  showToast('กำลังยกเลิก...');
  try{
    const res = await fetch(API_URL, {method:'POST', body: JSON.stringify({action:'delete', id, username:currentUser.username, password:currentUser.password})});
    const result = await res.json();
    if(!result || !result.ok) throw new Error(result && result.error ? result.error : 'การเชื่อมต่อ Google Sheet ล้มเหลว (ตรวจสอบการ Deploy)');
    await loadBookings();
    showToast('ยกเลิกการจองแล้ว');
  }catch(err){
    console.error('ยกเลิกการจองไม่สำเร็จ:', err);
    showToast('ยกเลิกไม่สำเร็จ: ' + err.message);
  }
}
function canDelete(b){
  return !!currentUser && (currentUser.isAdmin || String(currentUser.username) === String(b.owner));
}

/* ---------------- NAV ---------------- */
function openRoom(roomId){ state.view='room'; state.roomId=roomId; state.selectedDate = state.homeDate; render(); }
function goHome(){ state.view='home'; render(); }
function changeDate(delta){ state.selectedDate = shiftDate(state.selectedDate, delta); render(); }
function setDate(v){ state.selectedDate = v; render(); }
function changeHomeDate(delta){ state.homeDate = shiftDate(state.homeDate, delta); render(); }
function setHomeDate(v){ state.homeDate = v; render(); }
function goHomeToday(){ state.homeDate = todayISO(); render(); }
function openWeekView(){ state.view='week'; state.weekDate = state.selectedDate || state.homeDate || todayISO(); render(); }
function changeWeek(deltaWeeks){ state.weekDate = shiftDate(state.weekDate, deltaWeeks*7); render(); }
function goThisWeek(){ state.weekDate = todayISO(); render(); }
function goToDayFromWeek(roomId, date){ state.view='room'; state.roomId=roomId; state.selectedDate = date; render(); }

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>t.classList.remove('show'), 2200);
}

/* ---------------- MAIN RENDER ---------------- */
function render(){
  const root = document.getElementById('app');
  if(!dataReady){
    root.innerHTML = `<div class="topbar"><div class="brand-block"><div class="eyebrow">ระบบจองห้องประชุม</div><h1>กำลังโหลดข้อมูล...</h1></div></div>`;
    return;
  }
  let banner = '';
  if(syncError){
    banner = `<div class="sync-banner">⚠ ยังไม่ได้เชื่อมต่อ Google Sheet (หรือเชื่อมต่อไม่สำเร็จ) — ตั้งค่า API_URL ในโค้ดตามคำแนะนำใน Code.gs ก่อนใช้งานจริง ตอนนี้ข้อมูลจะไม่ถูกบันทึกหรือแชร์กับผู้อื่น</div>`;
  }
  let body;
  if(state.view==='home') body = renderHome();
  else if(state.view==='week') body = renderWeekView();
  else body = renderRoomView();
  root.innerHTML = banner + body + `<div id="modal-root"></div>`;
}
loadBookings();
setInterval(()=>{ if(dataReady && !modalState) loadBookings(); }, 15000);
setInterval(()=>{ if(state.view==='home' && dataReady){ const c=document.querySelector('.clock-block'); if(c) c.outerHTML = renderClock(); } }, 1000);
</script>
